# ==========================================================================
# Servidor do site — Robson Lopes
#
# Roda dentro do contêiner, atrás do Traefik do EasyPanel. Por isso aqui
# só existe HTTP na porta 80: o certificado e o redirecionamento de HTTPS
# são responsabilidade do painel, não deste arquivo.
# ==========================================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O Traefik já entrega o IP real do visitante neste cabeçalho; sem isto o
  # log registraria o IP interno do proxy em todas as linhas.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  # ---------------- Compressão ----------------
  # Só os formatos que ainda não vêm comprimidos. Recomprimir .webp, .woff2,
  # .mp4 ou .webm gasta CPU e devolve arquivo maior.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ---------------- Cabeçalhos de segurança ----------------
  # Sem Content-Security-Policy de propósito: a seção de localização embute
  # um iframe do Google Maps, e uma política mal calibrada derruba o mapa
  # silenciosamente. Vale acrescentar depois, testando o mapa junto.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---------------- Cache ----------------
  # O site não versiona nomes de arquivo (não existe app.a1b2c3.css), então
  # o cache é decidido por tipo, não por hash.

  # HTML revalida sempre: é ele que aponta para todo o resto.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # CSS e JS também revalidam. São poucos KB e o 304 é barato — enquanto
  # servir um CSS velho junto de um HTML novo quebra a tela inteira.
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fontes: nome fixo e conteúdo estável, podem ficar guardadas para sempre.
  location ~* \.woff2?$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fotos e vídeos: uma semana. Tempo suficiente para o visitante recorrente
  # não rebaixar tudo de novo, e curto o bastante para que trocar uma foto
  # do salão apareça rápido.
  location ~* \.(webp|jpg|jpeg|png|svg|mp4|webm|ico)$ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---------------- Rotas ----------------
  # Site de página única: o conteúdo é tudo âncora da mesma URL. Caminho
  # desconhecido devolve 404 de verdade — servir o index com status 200 em
  # qualquer endereço inventado cria página duplicada aos olhos do Google.
  # O visitante ainda vê o site; só o código de status diz a verdade.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /index.html;

  # Arquivos de projeto nunca vão para o ar (o .dockerignore já os deixa de
  # fora da imagem; esta é a segunda tranca, caso um deles escape).
  location ~* /(README|DEPLOY|MEDIA)\.md$|/(Dockerfile|nginx\.conf)$|\.(toml|dockerignore|assetsignore)$ {
    return 404;
  }
  location ~ /\. {
    deny all;
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}
