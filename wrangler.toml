# ==========================================================================
# Publicação do site na Cloudflare — Robson Lopes
#
# O site é estático, sem build: o Worker apenas serve os arquivos desta
# pasta. Publicar é um comando, de dentro de robson-lopes/:
#
#     npx wrangler deploy
#
# Endereço de apresentação confirmado: robsonlopes.conectfly.com.br.
# Requisito: a zona conectfly.com.br já precisa estar na Cloudflare, na
# mesma conta do deploy. O registro DNS é criado pelo próprio wrangler.
# ==========================================================================

# O nome tem que ser o do Worker que já existe na conta e que já está
# ligado ao subdomínio — senão o deploy cria um Worker novo e o domínio
# continua servindo o conteúdo antigo. Para renomear depois, troque aqui
# e mova o domínio personalizado no painel.
name = "robsonlopessss"
compatibility_date = "2026-08-17"

[assets]
directory = "."
# Página única: qualquer caminho cai no index.html em vez de dar 404.
not_found_handling = "single-page-application"

# Subdomínio de apresentação. Exige que a zona já esteja na Cloudflare —
# o registro DNS é criado automaticamente pelo deploy.
[[routes]]
pattern = "robsonlopes.conectfly.com.br"
custom_domain = true
