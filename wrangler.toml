# ==========================================================================
# Publicação do site na Cloudflare — Robson Lopes
#
# O site é estático, sem build: o Worker apenas serve os arquivos desta
# pasta. Publicar é um comando, de dentro de robson-lopes/:
#
#     npx wrangler deploy
#
# Endereço de apresentação: robsonlopes.conectfly.com.br.
# ==========================================================================

# O nome tem que ser o do Worker que já existe na conta e que já está
# ligado ao subdomínio — senão o deploy cria um Worker novo e o domínio
# continua servindo o conteúdo antigo. Para renomear depois, troque aqui
# e mova o domínio personalizado no painel.
name = "robsonlopessss"
compatibility_date = "2026-08-17"

[assets]
directory = "."
# Página única: qualquer caminho cai no index.html em vez de dar 404.
not_found_handling = "single-page-application"

# ROTA, e não Custom Domain — de propósito.
#
# O Worker "conectfly" atende uma rota curinga na zona (é o que gera os
# subdomínios dos cardápios dos clientes). Custom Domains perdem para
# rotas: a documentação da Cloudflare diz que o Worker de uma rota roda
# ANTES do Worker de um Custom Domain, e só chega nele se chamar fetch().
# Com Custom Domain, o curinga responderia e este site nunca apareceria.
#
# Entre rotas, porém, a mais específica vence. Esta cobre um único
# hostname, então desvia só este endereço e não encosta no curinga — os
# cardápios continuam funcionando como estão.
#
# Diferente do Custom Domain, uma rota NÃO cria registro DNS. O hostname
# precisa de um registro proxiado (nuvem laranja) na zona — o curinga `*`
# da zona já serve, se existir.
[[routes]]
pattern = "robsonlopes.conectfly.com.br/*"
zone_name = "conectfly.com.br"
